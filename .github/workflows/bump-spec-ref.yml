name: bump-spec-ref

# Reusable: bump a pinned ACDP-spec `ref:` SHA in a workflow file and open a PR.
# For repos that pin the spec by SHA for conformance (e.g. acdp-rs). Triggered
# by a `spec-released` dispatch from the spec repo (or manually). The PR is
# NEVER auto-merged — adopting a new spec is a deliberate review decision, and
# the PR's own CI re-runs conformance against the new fixtures so the reviewer
# sees whether this repo still conforms.
#
# Understands two pin shapes:
#   - inline:            a `repository: <spec>` line, then a `ref:` line
#                         (acdp-rs's ci.yml today)
#   - checkout-spec:      a `uses: …/acdp-ci/actions/checkout-spec@…` step,
#                         then a `ref:` line in its `with:` block
# Requires exactly ONE pin in the target file: if neither is found, the job fails
# loudly instead of opening an empty PR; if more than one is found (e.g. two jobs
# each independently checking out the spec), it fails loudly instead of silently
# rewriting only the first and leaving the rest stale. A file with multiple pins
# needs its extras bumped by hand in the same PR.
#
# Auth: the acdp-deps-bot App (org secrets ACDP_BOT_APP_ID / ACDP_BOT_PRIVATE_KEY).
#
# Caller shape:
#   on:
#     repository_dispatch: { types: [spec-released] }
#     workflow_dispatch:   { inputs: { sha: { required: false, default: '' } } }
#   jobs:
#     bump:
#       uses: agentcontextdistributionprotocol/acdp-ci/.github/workflows/bump-spec-ref.yml@v1
#       with:  { file: .github/workflows/ci.yml, sha: '${{ github.event.inputs.sha }}' }
#       secrets:
#         ACDP_BOT_APP_ID: '${{ secrets.ACDP_BOT_APP_ID }}'
#         ACDP_BOT_PRIVATE_KEY: '${{ secrets.ACDP_BOT_PRIVATE_KEY }}'

on:
  workflow_call:
    secrets:
      ACDP_BOT_APP_ID:
        required: true
      ACDP_BOT_PRIVATE_KEY:
        required: true
    inputs:
      file:
        description: 'Workflow file holding the pinned spec ref'
        required: false
        type: string
        default: .github/workflows/ci.yml
      spec-repo:
        required: false
        type: string
        default: agentcontextdistributionprotocol/agentcontextdistributionprotocol
      sha:
        description: 'Target spec SHA (blank = event payload, else spec HEAD)'
        required: false
        type: string
        default: ''

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Resolve target + current spec SHA
        id: v
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SPEC: ${{ inputs.spec-repo }}
          FILE: ${{ inputs.file }}
          INSHA: ${{ inputs.sha }}
          EVSHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          SHA="${EVSHA:-$INSHA}"
          [ -n "$SHA" ] || SHA=$(gh api "repos/$SPEC/commits/HEAD" --jq .sha)
          CUR=$(awk -v s="$SPEC" '(index($0,"repository: "s) || index($0,"acdp-ci/actions/checkout-spec@")){f=1;next} f&&match($0,/[0-9a-f]{40}/){print substr($0,RSTART,RLENGTH);exit}' "$FILE")
          if [ -z "$CUR" ]; then
            echo "::error file=$FILE::bump-spec-ref: no pinned spec ref found in $FILE (looked for a 'repository: $SPEC' line or an 'acdp-ci/actions/checkout-spec@' step, each followed by a 'ref:' line)." >&2
            exit 1
          fi
          # The rewriter below only ever touches the FIRST anchor in the file — a second
          # pin (e.g. two jobs each checking out the spec) would be silently left stale,
          # and the post-rewrite assertion wouldn't catch it (it re-derives the same
          # first match). Reject rather than half-bump.
          ANCHOR_COUNT=$(awk -v s="$SPEC" '(index($0,"repository: "s) || index($0,"acdp-ci/actions/checkout-spec@")){c++} END{print c+0}' "$FILE")
          if [ "$ANCHOR_COUNT" -gt 1 ]; then
            echo "::error file=$FILE::bump-spec-ref: found $ANCHOR_COUNT spec-pin anchors in $FILE — this workflow only rewrites the first and would silently leave the rest stale. Not supported today; bump the others by hand in the same PR. (If this is really only ONE checkout-spec step, an explicit 'repository:' override in its 'with:' block also counts as an anchor and can trigger this on a single step — drop the override to use the action's default, or bump this file by hand.)" >&2
            exit 1
          fi
          echo "sha=$SHA"                  >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}"          >> "$GITHUB_OUTPUT"
          echo "cur=$CUR"                  >> "$GITHUB_OUTPUT"
          echo "branch=deps/spec-${SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$CUR" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Spec ref already at $SHA."; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "spec ${CUR:-none} -> $SHA"; fi

      - name: Branch already open?
        if: ${{ steps.v.outputs.changed == 'true' }}
        id: br
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${{ steps.v.outputs.branch }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rewrite the pinned ref
        if: ${{ steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        env:
          SPEC: ${{ inputs.spec-repo }}
          SHA: ${{ steps.v.outputs.sha }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          # Replace the ref: that follows either the inline spec-repo checkout
          # (`repository: <spec>` … `ref:`) or a checkout-spec composite-action step
          # (`uses: …/checkout-spec@…` … `ref:`). The ANCHOR_COUNT check above already
          # guarantees exactly one anchor exists in $FILE, so "first match" and "only
          # match" are the same thing here. The `\S+` after `checkout-spec\@` consumes
          # the action's own `@v1`/`@<sha>` pin, so it can never be mistaken for the
          # spec's ref even if the action itself is SHA-pinned.
          SPEC="$SPEC" SHA="$SHA" perl -0777 -i -pe '
            my $spec = quotemeta($ENV{SPEC}); my $sha = $ENV{SHA};
            s{((?:repository:\s*$spec|acdp-ci/actions/checkout-spec\@\S+).*?\bref:\s*)[0-9a-f]{7,40}}{$1$sha}s;
          ' "$FILE"
          # Assert the rewrite actually landed — converts a silent no-op (leading to a
          # cryptic "nothing to commit" death below) into a named failure here.
          NEW=$(awk -v s="$SPEC" '(index($0,"repository: "s) || index($0,"acdp-ci/actions/checkout-spec@")){f=1;next} f&&match($0,/[0-9a-f]{40}/){print substr($0,RSTART,RLENGTH);exit}' "$FILE")
          if [ "$NEW" != "$SHA" ]; then
            echo "::error file=$FILE::bump-spec-ref: rewrite did not land — expected ref $SHA, found '${NEW:-<none>}' in $FILE after rewriting." >&2
            exit 1
          fi

      - name: Open PR (held for review — never auto-merged)
        if: ${{ steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BR: ${{ steps.v.outputs.branch }}
          SHA: ${{ steps.v.outputs.sha }}
          SHORT: ${{ steps.v.outputs.short }}
          CUR: ${{ steps.v.outputs.cur }}
          SPEC: ${{ inputs.spec-repo }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          git config user.name 'acdp-deps-bot[bot]'
          git config user.email '${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com'
          git checkout -b "$BR"
          git add -A
          git commit -m "chore(spec): bump pinned ACDP spec ref to $SHORT"
          git push -u origin "$BR"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BR" \
            --title "chore(spec): adopt ACDP spec @ $SHORT" \
            --body "Bumps the pinned spec ref (\`$(printf %.7s "$CUR")\` → \`$SHORT\`) in \`$FILE\`. Conformance CI re-runs against the new fixtures on this PR — **review the result and merge deliberately**; the pin exists so spec changes never silently alter CI. https://github.com/$SPEC/commit/$SHA"
