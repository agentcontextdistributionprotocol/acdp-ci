name: bump-consume

# Reusable "consume a new acdp SDK release" for every consumer repo.
# Called by a thin bump-acdp.yml (repository_dispatch: acdp-released +
# workflow_dispatch). It resolves the target version, waits for the registry to
# actually serve it, edits the manifest + lockfile for the given ecosystem,
# opens a bump PR, and — for a non-breaking bump — arms auto-merge.
#
# Auth: the acdp-deps-bot GitHub App (org secrets ACDP_BOT_APP_ID /
# ACDP_BOT_PRIVATE_KEY). Installation tokens trigger CI on the bot PR (which
# GITHUB_TOKEN cannot) and are short-lived (1h, minted per run) — so there are no PATs anywhere.
#
# Caller shape:
#   on:
#     repository_dispatch: { types: [acdp-released] }
#     workflow_dispatch:   { inputs: { version: { required: false, default: '' } } }
#   jobs:
#     bump:
#       uses: agentcontextdistributionprotocol/acdp-ci/.github/workflows/bump-consume.yml@v1
#       with:  { ecosystem: npm, package: '@agentcontextdistributionprotocol/acdp' }
#       secrets:
#         ACDP_BOT_APP_ID: '${{ secrets.ACDP_BOT_APP_ID }}'
#         ACDP_BOT_PRIVATE_KEY: '${{ secrets.ACDP_BOT_PRIVATE_KEY }}'

on:
  workflow_call:
    secrets:
      ACDP_BOT_APP_ID:
        required: true
      ACDP_BOT_PRIVATE_KEY:
        required: true
    inputs:
      ecosystem:
        description: 'npm | cargo | uv'
        required: true
        type: string
      package:
        description: 'SDK package name as it appears in this repo''s manifest'
        required: false
        type: string
        default: acdp
      version:
        description: 'Explicit version (manual dispatch); blank = event payload or latest'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node version for the npm ecosystem when the consumer has no .nvmrc / .node-version (the file wins, so the lockfile is written by the same npm major as its CI)'
        required: false
        type: string
        default: '22'
      extra-manifests:
        description: 'cargo only: extra directories (each with its own Cargo.toml + Cargo.lock), whitespace separated, bumped in lockstep with the root — e.g. tools/live-smoke'
        required: false
        type: string
        default: ''
      allow-major:
        description: 'Arm auto-merge even on a major bump'
        required: false
        type: boolean
        default: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACDP_BOT_APP_ID }}
          private-key: ${{ secrets.ACDP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Pick the Node version source (npm)
        id: nodever
        if: ${{ inputs.ecosystem == 'npm' }}
        run: |
          for f in .nvmrc .node-version; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "file=" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: ${{ inputs.ecosystem == 'npm' }}
        with:
          node-version: ${{ steps.nodever.outputs.file == '' && inputs.node-version || '' }}
          node-version-file: ${{ steps.nodever.outputs.file }}

      - name: Resolve versions
        id: v
        env:
          ECO: ${{ inputs.ecosystem }}
          PKG: ${{ inputs.package }}
          MANUAL: ${{ inputs.version }}
          EVENT: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          TARGET="${EVENT:-$MANUAL}"
          if [ -z "$TARGET" ]; then
            case "$ECO" in
              npm)   TARGET=$(npm view "$PKG" version) ;;
              cargo) TARGET=$(curl -fsSL -A 'acdp-ci-bump' "https://crates.io/api/v1/crates/$PKG" | jq -r '.crate.max_stable_version') ;;
              uv)    TARGET=$(curl -fsSL "https://pypi.org/pypi/$PKG/json"       | jq -r '.info.version') ;;
              *) echo "::error::unknown ecosystem $ECO"; exit 1 ;;
            esac
          fi
          TARGET="${TARGET#v}"
          case "$ECO" in
            npm)   CURRENT=$(node -e "const l=require('./package-lock.json').packages;const p=l['node_modules/'+process.env.PKG]||l['node_modules/'+process.env.PKG.split('/').pop()];process.stdout.write(p?p.version:'')" ) ;;
            cargo) CURRENT=$(awk -v p="$PKG" '$0=="name = \""p"\""{f=1} f&&/^version = /{v=$0;sub(/^version = "/,"",v);sub(/"$/,"",v);print v;exit}' Cargo.lock) ;;
            uv)    CURRENT=$(awk -v p="$PKG" '$0=="name = \""p"\""{f=1} f&&/^version = /{v=$0;sub(/^version = "/,"",v);sub(/"$/,"",v);print v;exit}' uv.lock) ;;
          esac
          {
            echo "target=$TARGET"
            echo "current=$CURRENT"
            echo "branch=deps/${PKG##*/}-$TARGET"
          } >> "$GITHUB_OUTPUT"
          # major-ish for 0.x = a minor change; otherwise a major change
          major() { echo "${1%%.*}"; }; minor() { echo "$1" | cut -d. -f2; }
          BREAKING=false
          if [ "$(major "$TARGET")" != "$(major "$CURRENT")" ]; then BREAKING=true
          elif [ "$(major "$TARGET")" = "0" ] && [ "$(minor "$TARGET")" != "$(minor "$CURRENT")" ]; then BREAKING=true; fi
          echo "breaking=$BREAKING" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$TARGET" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Already at $TARGET."; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$PKG $CURRENT -> $TARGET (breaking=$BREAKING)"; fi

      - name: Branch already open?
        if: ${{ steps.v.outputs.changed == 'true' }}
        id: br
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${{ steps.v.outputs.branch }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "PR branch already exists."
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Wait for registry to serve the version
        if: ${{ steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        env:
          ECO: ${{ inputs.ecosystem }}
          PKG: ${{ inputs.package }}
          T: ${{ steps.v.outputs.target }}
        run: |
          set -euo pipefail
          # The release dispatch can fire before every artifact is published
          # (acdp-ui-console run 41121945953 gave up 6 s before acdp-wasm 0.19.0
          # appeared), and propagation can take 10+ min: poll with backoff
          # (5 s, 10 s, … capped at 30 s) up to WAIT_SECS. The relock steps
          # below then wait for the exact version to be installable.
          WAIT_SECS=720; deadline=$((SECONDS + WAIT_SECS)); i=0
          while :; do
            i=$((i + 1))
            case "$ECO" in
              npm)   [ "$(npm view "$PKG@$T" version --prefer-online 2>/dev/null || true)" = "$T" ] && { echo ok; exit 0; } ;;
              cargo) curl -fsSL -A 'acdp-ci-bump' "https://crates.io/api/v1/crates/$PKG/$T" >/dev/null 2>&1 && { echo ok; exit 0; } ;;
              uv)    curl -fsSL "https://pypi.org/pypi/$PKG/$T/json"       >/dev/null 2>&1 && { echo ok; exit 0; } ;;
            esac
            [ "$SECONDS" -ge "$deadline" ] && break
            s=$((5 * i)); [ "$s" -gt 30 ] && s=30
            echo "waiting for $PKG@$T (attempt $i, next in ${s}s)…"; sleep "$s"
          done
          echo "::error::$PKG@$T not on the registry after $((WAIT_SECS / 60)) min — no PR opened"; exit 1

      - name: Apply bump (manifest + lockfile)
        if: ${{ steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        env:
          ECO: ${{ inputs.ecosystem }}
          PKG: ${{ inputs.package }}
          T: ${{ steps.v.outputs.target }}
        run: |
          set -euo pipefail
          case "$ECO" in
            npm)
              # Rewrite every dependency entry that points at PKG — covers both
              # the real name and any `npm:PKG@…` alias. The re-lock happens in
              # the next step (npm-relock), which verifies the lock fails closed.
              node -e '
                const fs=require("fs"), pkg=process.env.PKG, T=process.env.T;
                const j=JSON.parse(fs.readFileSync("package.json","utf8"));
                for (const sec of ["dependencies","devDependencies","optionalDependencies"]) {
                  const d=j[sec]; if(!d) continue;
                  for (const k of Object.keys(d)) {
                    if (k===pkg) d[k]="^"+T;
                    else if (typeof d[k]==="string" && d[k].startsWith("npm:"+pkg+"@")) d[k]="npm:"+pkg+"@^"+T;
                  }
                }
                fs.writeFileSync("package.json", JSON.stringify(j,null,2)+"\n");
              ' ;;
            cargo)
              # Done by the next step (cargo-bump): keeps the requirement operator,
              # re-locks extra-manifests too, moves acdp* vet exemptions (acdp-ci#47).
              : ;;
            uv)
              # Done by uv-relock (below): locks exactly PKG==T, retrying until
              # the index serves it, failing closed otherwise.
              : ;;
          esac

      # cargo only: rewrite each requirement keeping its operator (an exact
      # `=x.y.z` pin stays exact), re-lock the root and every extra-manifests
      # dir, and move matching acdp* cargo-vet exemptions. Fails closed — and so
      # opens no PR — on a requirement it cannot rewrite (acdp-ci#47).
      - name: Bump manifests, lockfiles and vet exemptions (cargo)
        if: ${{ inputs.ecosystem == 'cargo' && steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        uses: agentcontextdistributionprotocol/acdp-ci/actions/cargo-bump@v1
        with:
          package: ${{ inputs.package }}
          version: ${{ steps.v.outputs.target }}
          extra-manifests: ${{ inputs.extra-manifests }}

      # npm only: wait for every platform (optional) package of the target,
      # relock, and verify `npm ci` would accept the lock. Fails the job — and
      # so opens no PR — if the lock is not installable (acdp-ci#28).
      - name: Re-lock and verify (npm)
        if: ${{ inputs.ecosystem == 'npm' && steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        uses: agentcontextdistributionprotocol/acdp-ci/actions/npm-relock@v1
        with:
          package: ${{ inputs.package }}
          version: ${{ steps.v.outputs.target }}

      # uv only: lock exactly PKG==T, retrying with capped backoff until the
      # simple index serves T (it lags the JSON API the wait step polls), and
      # verify uv.lock pins T. Fails closed — no PR whose lock installs a
      # different version than its title.
      - name: Re-lock and verify (uv)
        if: ${{ inputs.ecosystem == 'uv' && steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        uses: agentcontextdistributionprotocol/acdp-ci/actions/uv-relock@v1
        with:
          package: ${{ inputs.package }}
          version: ${{ steps.v.outputs.target }}

      - name: Open PR + arm auto-merge
        if: ${{ steps.v.outputs.changed == 'true' && steps.br.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BR: ${{ steps.v.outputs.branch }}
          CUR: ${{ steps.v.outputs.current }}
          T: ${{ steps.v.outputs.target }}
          BREAKING: ${{ steps.v.outputs.breaking }}
          PKG: ${{ inputs.package }}
          ALLOW_MAJOR: ${{ inputs.allow-major }}
        run: |
          set -euo pipefail
          git config user.name 'acdp-deps-bot[bot]'
          git config user.email '${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com'
          git checkout -b "$BR"
          git add -A
          NAME="${PKG##*/}"
          git commit -m "chore(deps): bump $NAME to $T"
          git push -u origin "$BR"
          NOTE=""; [ "$BREAKING" = "true" ] && NOTE=$'\n\n> ⚠️ **Breaking bump held** — auto-merge is NOT armed; review and merge manually.'
          gh pr create --base "${GITHUB_REF_NAME}" --head "$BR" \
            --title "chore(deps): bump $NAME to $T" \
            --body "Event-driven bump of \`$PKG\` $CUR → $T, dispatched on publish.$NOTE"
          if [ "$ALLOW_MAJOR" = "true" ] || [ "$BREAKING" = "false" ]; then
            # Same guard as auto-merge.yml (CI-6): refuse to arm GitHub's native
            # auto-merge on a branch with no required status checks configured —
            # it merges effectively instantly with nothing to wait for. The PR
            # still opens either way; only the unattended-merge is withheld.
            CHECKS_OK=false
            branch_info="$(gh api "repos/${{ github.repository }}/branches/$GITHUB_REF_NAME" 2>/dev/null || echo '')"
            if [ -n "$branch_info" ]; then
              protected="$(echo "$branch_info" | jq -r '.protected')"
              contexts_count="$(echo "$branch_info" | jq '.protection.required_status_checks.contexts | length? // 0')"
              [ "$protected" = "true" ] && [ "$contexts_count" -gt 0 ] && CHECKS_OK=true
            fi
            if [ "$CHECKS_OK" = "true" ]; then
              gh pr merge --auto --squash "$BR"
            else
              echo "::warning::$GITHUB_REF_NAME has no required status checks configured — auto-merge NOT armed on this bump PR ($BR). Run scripts/standardize.sh against this repo, then merge that PR manually or re-run once adopted."
            fi
          fi
